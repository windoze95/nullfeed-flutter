name: Store Screenshots

# Manual-only: captures App Store screenshots by driving the real app against
# the nullfeed-demo server on an iOS simulator, saving true-framebuffer PNGs.
on:
  workflow_dispatch:
  push:
    branches: [chore/store-screenshots]

env:
  FLUTTER_VERSION: "3.41.4"

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iphone
            devicetype: "iPhone 17 Pro Max"
          - device: ipad
            devicetype: "iPad Pro 13-inch"
    name: Capture ${{ matrix.device }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # NOTE: no pub/.dart_tool cache — a restored .dart_tool poisons
      # `flutter build ios` native-assets fingerprints (see ci.yml).

      - name: Start demo server
        run: |
          git clone --depth 1 https://github.com/windoze95/nullfeed-demo.git /tmp/nullfeed-demo
          cd /tmp/nullfeed-demo
          python3 -m pip install -r requirements.txt || python3 -m pip install --break-system-packages -r requirements.txt
          bash download_content.sh
          python3 seed.py
          (python3 main.py > /tmp/demo-server.log 2>&1 &)
          for i in $(seq 1 20); do
            curl -sf http://localhost:8484/api/health && break
            sleep 1
          done
          curl -sf http://localhost:8484/api/health

      - name: Create and boot simulator
        id: sim
        run: |
          DEVTYPE=$(xcrun simctl list devicetypes | grep -F "${{ matrix.devicetype }}" | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9._-]+')
          RUNTIME=$(xcrun simctl list runtimes | grep -E '^iOS' | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS[-0-9]+')
          echo "devicetype=$DEVTYPE runtime=$RUNTIME"
          UDID=$(xcrun simctl create screenshots-device "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Start capture server
        run: |
          mkdir -p shots
          UDID=${{ steps.sim.outputs.udid }} OUTDIR=$PWD/shots PORT=8765 nohup python3 tool/screenshots/capture_server.py > /tmp/capture-server.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf -o /dev/null http://localhost:8765/capture/smoke && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8765/capture/smoke || { cat /tmp/capture-server.log; exit 1; }
          rm -f shots/smoke.png

      - name: Prebuild app
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build ios --simulator --debug

      - name: Run screenshot driver
        run: flutter test integration_test/screenshots_test.dart -d ${{ steps.sim.outputs.udid }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.device }}
          path: shots/
          if-no-files-found: warn
